<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grade Calculator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f1f2f6);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #15171c);
    --hint: var(--tg-theme-hint-color, #7d828c);
    --accent: var(--tg-theme-button-color, #2f7cf6);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--hint) 22%, transparent);
    --track: color-mix(in srgb, var(--hint) 25%, transparent);
    --soft: color-mix(in srgb, var(--accent) 12%, transparent);
    --good: #2fb36b;
    --bad: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tg]) {
      --bg: #101114; --card: #1b1d22; --text: #eceef2; --hint: #8b919c; --accent: #5b9cff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size: 20px; margin: 4px 4px 2px; }
  .sub { color: var(--hint); margin: 0 4px 12px; font-size: 13px; }

  .tabs { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 12px; padding: 2px 16px 4px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; border: 0; border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 14px; font-weight: 500;
    background: var(--card); color: var(--text); cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-text); }

  .card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--hint); text-transform: uppercase;
    letter-spacing: .04em; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 span { text-transform: none; letter-spacing: 0; font-weight: 400; }

  .field { padding: 9px 0; }
  .field + .field { border-top: 1px solid var(--line); }
  .field-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .field-head label { font-weight: 500; }
  .w { color: var(--hint); font-size: 12px; font-weight: 400; margin-left: 6px; }
  .num { width: 72px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--text); font: inherit; font-weight: 600; text-align: right; }
  .num::placeholder { color: var(--hint); font-weight: 400; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; margin-top: 8px; }
  .items label { display: grid; gap: 3px; font-size: 12px; color: var(--hint); }
  .items .num { width: 100%; }
  input[type=range] { width: 100%; margin: 10px 0 2px; accent-color: var(--accent); height: 28px; }

  .seg { display: inline-flex; background: var(--track); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: transparent; color: var(--text); font: inherit; font-size: 13px;
    padding: 4px 12px; border-radius: 6px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--card); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
  .setting { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; font-size: 13px; color: var(--hint); }

  .result { display: flex; align-items: center; gap: 16px; }
  .badge { flex: none; width: 72px; height: 72px; border-radius: 18px; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-text); font-size: 30px; font-weight: 700; }
  .badge.f { background: var(--bad); }
  .badge.empty { background: var(--track); color: var(--hint); }
  .badge.sm { width: 44px; height: 44px; border-radius: 12px; font-size: 18px; }
  .stats { flex: 1; min-width: 0; }
  .big { font-size: 26px; font-weight: 700; }
  .big span { font-size: 15px; color: var(--hint); font-weight: 500; }
  .row { display: flex; justify-content: space-between; color: var(--hint); font-size: 14px; margin-top: 2px; }
  .row b { color: var(--text); }

  .bar { position: relative; height: 10px; border-radius: 5px; background: var(--track); margin: 16px 0 22px; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--accent); }
  .bar .tick { position: absolute; top: -3px; width: 2px; height: 16px; background: var(--card); }
  .bar .tick i { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font-style: normal;
    font-size: 10px; color: var(--hint); white-space: nowrap; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 4px; text-align: left; border-top: 1px solid var(--line); }
  th { color: var(--hint); font-weight: 500; font-size: 13px; border-top: 0; padding-top: 0; }
  td:last-child, th:last-child { text-align: right; }
  tr.current td { color: var(--accent); font-weight: 700; }
  .muted { color: var(--hint); }
  .ok { color: var(--good); }
  .note { color: var(--hint); font-size: 12px; margin: 8px 2px 0; }
  .links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .link { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 8px; border-radius: 10px;
    background: var(--soft); color: var(--accent); font-weight: 600; font-size: 14px; text-decoration: none; }
  .foot { text-align: center; color: var(--hint); font-size: 12px; margin-top: 4px; }

  .course { display: flex; align-items: center; gap: 12px; padding: 10px 0; cursor: pointer; }
  .course + .course { border-top: 1px solid var(--line); }
  .course .info { flex: 1; min-width: 0; }
  .course .name { font-weight: 600; }
  .course .meta { color: var(--hint); font-size: 13px; }
  .course .needs { text-align: right; font-size: 13px; color: var(--hint); font-variant-numeric: tabular-nums; }
  .course .needs b { color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>Grade calculator</h1>
  <p class="sub">Economics &amp; Data Science · Class of 2028 · Fall 2026</p>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Courses"></nav>
  <div id="view"></div>
  <p class="foot">Saved only on this device. Nothing you enter is sent anywhere.</p>
</main>

<script type="module">
  import { fmt } from "/calc.js";
  import { COURSES, GRADES, courseTotal, finalNeeded, gpa, letterFor } from "/courses.js";

  const tg = window.Telegram?.WebApp;
  if (tg && tg.platform !== "unknown") {
    document.documentElement.dataset.tg = "";
    tg.ready();
    tg.expand();
  }

  // ---- state (kept in this browser only) ----------------------------------
  const KEY = "grades-v2";
  const blank = () => ({ values: {}, final: 70 });
  let state = { tab: "overview", ungraded: 100, courses: {} };
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved) state = { ...state, ...saved };
    else {
      const old = JSON.parse(localStorage.getItem("scores") || "null"); // first version of the app
      if (old) state.courses.gt = { values: { midterm: old.midterm, bonus: old.bonus }, final: old.final };
    }
  } catch {}
  for (const c of COURSES) state.courses[c.id] ??= blank();
  if (state.tab !== "overview" && !COURSES.some((c) => c.id === state.tab)) state.tab = "overview";
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

  const $ = (sel, root = document) => root.querySelector(sel);
  const num = (s) => { const v = parseFloat(String(s).replace(",", ".")); return Number.isFinite(v) ? Math.min(100, Math.max(0, v)) : null; };
  const show = (v) => (v === null || v === undefined ? "" : v);
  const totalOf = (c, f = state.courses[c.id].final) => courseTotal(c, state.courses[c.id].values, f, state.ungraded);
  const needCell = (n) => n === null ? '<span class="muted">out of reach</span>' : n === 0 ? '<span class="ok">any score</span>' : fmt(n);
  const badge = (letter, cls = "") => `<div class="badge ${cls} ${letter === "F" ? "f" : ""}">${letter}</div>`;

  // Links: t.me links stay inside Telegram, others open in the browser.
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a[data-link]");
    if (!a) return;
    e.preventDefault();
    const url = a.href;
    if (tg && tg.platform !== "unknown") {
      if (url.startsWith("https://t.me/")) tg.openTelegramLink(url);
      else tg.openLink(url);
    } else {
      window.open(url, "_blank", "noopener");
    }
  });

  // ---- tabs ---------------------------------------------------------------
  function renderTabs() {
    const tabs = [{ id: "overview", short: "Overview" }, ...COURSES];
    $("#tabs").innerHTML = tabs.map((t) =>
      `<button class="tab" role="tab" data-tab="${t.id}" aria-selected="${state.tab === t.id}">${t.short}</button>`).join("");
  }
  $("#tabs").addEventListener("click", (e) => {
    const id = e.target.closest("[data-tab]")?.dataset.tab;
    if (id) go(id);
  });
  function go(id) {
    state.tab = id;
    save();
    renderTabs();
    render();
    $(`[data-tab="${id}"]`)?.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
    window.scrollTo({ top: 0 });
  }

  // ---- overview -----------------------------------------------------------
  const hasScores = (c) => c.parts.some((p) => !p.bonus && (p.count
    ? (state.courses[c.id].values[p.key] ?? []).some((v) => v !== null && v !== undefined)
    : state.courses[c.id].values[p.key] !== null && state.courses[c.id].values[p.key] !== undefined));

  function renderOverview() {
    const totals = {};
    const rows = COURSES.map((c) => {
      if (!hasScores(c)) {
        return `<div class="course" data-go="${c.id}">
          <div class="badge sm empty">–</div>
          <div class="info"><div class="name">${c.short}</div>
            <div class="meta">${c.code} · ${c.credits} credits · tap to add your scores</div></div>
          <div class="needs">›</div>
        </div>`;
      }
      const t = (totals[c.id] = totalOf(c));
      const g = letterFor(t);
      const v = state.courses[c.id].values;
      const forA = finalNeeded(c, v, 85, state.ungraded), forAp = finalNeeded(c, v, 93, state.ungraded);
      return `<div class="course" data-go="${c.id}">
        ${badge(g.letter, "sm")}
        <div class="info"><div class="name">${c.short}</div>
          <div class="meta">${c.code} · ${c.credits} credits · ${fmt(t)} with ${fmt(state.courses[c.id].final)} on final</div></div>
        <div class="needs">A <b>${needCell(forA)}</b><br>A+ <b>${needCell(forAp)}</b></div>
      </div>`;
    }).join("");
    const g = gpa(totals);
    const counted = COURSES.filter((c) => totals[c.id] !== undefined);
    $("#view").innerHTML = `
      <section class="card">
        <div class="big">${g === null ? "–" : fmt(g)} <span>/ 4.5 GPA</span></div>
        <div class="row">${g === null ? "Add scores in a course to see your GPA"
          : `From ${counted.length} of ${COURSES.length} courses · ${counted.reduce((s, c) => s + c.credits, 0)} credits`}</div>
        <div class="row">Uses each course's expected final</div>
      </section>
      <section class="card">
        <h2>Courses <span>Final needed for</span></h2>
        ${rows}
      </section>
      <p class="note">Tap a course to enter scores and your expected final. Ungraded items count as ${state.ungraded}; you can change this inside any course.</p>`;
    for (const el of document.querySelectorAll("[data-go]")) el.addEventListener("click", () => go(el.dataset.go));
  }

  // ---- one course -------------------------------------------------------------
  function renderCourse(c) {
    const s = state.courses[c.id];
    const fields = c.parts.map((p) => {
      const weight = p.bonus ? "" : `<span class="w">${p.weight}%${p.best ? ` · best ${p.best} of ${p.count}` : ""}</span>`;
      if (p.count) {
        const items = Array.from({ length: p.count }, (_, i) =>
          `<label>${p.label} ${i + 1}<input class="num" inputmode="decimal" data-part="${p.key}" data-i="${i}" placeholder="—" value="${show(s.values[p.key]?.[i])}"></label>`).join("");
        return `<div class="field"><div class="field-head"><label>${p.label}s${weight}</label></div><div class="items">${items}</div></div>`;
      }
      const ph = p.bonus ? "0" : "—";
      return `<div class="field"><div class="field-head"><label for="f-${p.key}">${p.label}${p.unit ? ` (${p.unit})` : ""}${weight}</label>
        <input class="num" id="f-${p.key}" inputmode="decimal" data-part="${p.key}" placeholder="${ph}" value="${show(s.values[p.key])}"></div></div>`;
    }).join("");

    $("#view").innerHTML = `
      <section class="card">
        <h2>Materials</h2>
        <div class="links">
          <a class="link" href="${c.materials}" data-link>📁 Course materials</a>
          <a class="link" href="${c.syllabus}" data-link>📄 Syllabus</a>
        </div>
      </section>
      <section class="card">
        <h2>${c.name} <span>${c.code} · ${c.credits} cr</span></h2>
        ${fields}
        <div class="setting">Not graded yet counts as
          <span class="seg" role="group" aria-label="Ungraded items count as">
            <button data-ungraded="100" aria-pressed="${state.ungraded === 100}">100</button>
            <button data-ungraded="0" aria-pressed="${state.ungraded === 0}">0</button>
          </span></div>
      </section>
      <section class="card">
        <div class="field-head"><label for="final-n">Expected final <span class="w">${c.finalWeight}%</span></label>
          <input class="num" id="final-n" inputmode="decimal" value="${s.final}"></div>
        <input id="final" type="range" min="0" max="100" step="0.5" value="${s.final}" aria-label="Expected final">
      </section>
      <section class="card" aria-live="polite">
        <div class="result">
          <div id="badge"></div>
          <div class="stats">
            <div class="big" id="total"></div>
            <div class="row">Before the final <b id="before"></b></div>
            <div class="row">Grade points <b id="points"></b></div>
          </div>
        </div>
        <div class="bar" id="bar"><div class="fill" id="fill"></div>${GRADES.filter((g) => g.min)
          .map((g) => `<div class="tick" style="left:${g.min}%"><i>${g.letter}</i></div>`).join("")}</div>
      </section>
      <section class="card">
        <h2>Final exam needed</h2>
        <table><thead><tr><th>Grade</th><th>Total</th><th>Final needed</th></tr></thead><tbody id="needs"></tbody></table>
        ${c.note ? `<p class="note">${c.note}</p>` : ""}
      </section>`;

    for (const input of document.querySelectorAll("[data-part]")) {
      input.addEventListener("input", () => {
        const { part, i } = input.dataset;
        const v = num(input.value);
        if (i === undefined) s.values[part] = v;
        else (s.values[part] ??= [])[+i] = v;
        update(c);
      });
    }
    for (const b of document.querySelectorAll("[data-ungraded]")) {
      b.addEventListener("click", () => { state.ungraded = +b.dataset.ungraded; save(); renderCourse(c); });
    }
    const slider = $("#final"), box = $("#final-n");
    slider.addEventListener("input", () => { s.final = +slider.value; box.value = slider.value; update(c); });
    box.addEventListener("input", () => { s.final = num(box.value) ?? 0; slider.value = s.final; update(c); });
    box.addEventListener("blur", () => { box.value = s.final; });
    update(c);
  }

  let lastLetter;
  function update(c) {
    const s = state.courses[c.id];
    const t = totalOf(c);
    const g = letterFor(t);
    $("#badge").outerHTML = `<div id="badge">${badge(g.letter)}</div>`;
    $("#total").innerHTML = `${fmt(t)} <span>/ 100</span>`;
    $("#before").textContent = c.formula === "gt" ? "depends on final" : `${fmt(totalOf(c, 0))} / ${100 - c.finalWeight}`;
    $("#points").textContent = fmt(g.points);
    $("#fill").style.width = `${t}%`;
    $("#needs").innerHTML = GRADES.filter((x) => x.letter !== "F").map((x) =>
      `<tr class="${x.letter === g.letter ? "current" : ""}"><td>${x.letter}</td><td>${x.min}+</td><td>${needCell(finalNeeded(c, s.values, x.min, state.ungraded))}</td></tr>`).join("");
    if (lastLetter && lastLetter !== g.letter) tg?.HapticFeedback?.selectionChanged();
    lastLetter = g.letter;
    save();
  }

  function render() {
    lastLetter = undefined;
    const c = COURSES.find((x) => x.id === state.tab);
    c ? renderCourse(c) : renderOverview();
  }

  renderTabs();
  render();
</script>
</body>
</html>
